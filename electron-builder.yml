appId: com.lonelygirl.desktop
productName: LonelyGirl
copyright: © LonelyGirl

directories:
  output: dist-desktop
  buildResources: build

# Only the shell goes in the asar. The app itself — Next's traced server plus
# its dependencies — rides along in extraResources, because a Node server can't
# be require()'d out of an asar archive reliably.
files:
  - electron/**/*
  - package.json
  - "!**/node_modules/**"

extraResources:
  - from: .next/standalone
    to: server

# The traced server brings its own node_modules; nothing here needs compiling.
npmRebuild: false

mac:
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  # No Apple Developer account is assumed — unsigned builds still run locally
  # (right-click → Open the first time). Set CSC_LINK/CSC_KEY_PASSWORD to sign.
  identity: null

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Network
  icon: build/icon.png
