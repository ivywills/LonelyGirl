<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>LonelyGirl</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1e1e23;
        --card: #29292f;
        --text: #ececf1;
        --muted: #9a9aa8;
        --accent: #a78bfa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(env(safe-area-inset-top) + 24px) 24px
          calc(env(safe-area-inset-bottom) + 24px);
        background: var(--bg);
        color: var(--text);
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .screen {
        width: 100%;
        max-width: 340px;
        padding: 32px 26px;
        border-radius: 18px;
        background: var(--card);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 21px;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 14.5px;
      }
      code {
        display: block;
        padding: 10px 12px;
        border-radius: 9px;
        background: rgba(0, 0, 0, 0.32);
        color: var(--accent);
        font-size: 12.5px;
        word-break: break-all;
      }
      button {
        margin-top: 18px;
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #1e1e23;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!--
      Capacitor needs a local webDir even when it loads a remote URL. This is
      what shows if the build was synced without a server URL, or if the phone
      can't reach it — a dead-end black screen would be worse.
    -->
    <div class="screen">
      <h1>Can't reach LonelyGirl</h1>
      <p>
        The app couldn't load the site. Check your connection — or, if you're
        building this yourself, set the server URL and re-sync:
      </p>
      <code>LONELYGIRL_SERVER_URL=https://…<br />npm run mobile:sync</code>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
